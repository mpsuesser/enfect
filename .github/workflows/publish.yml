name: Publish

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Verify and publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.4.4'
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false
            # npm trusted publishing needs npm 11.5.1 or newer.
            - run: npm install --global npm@latest
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run check
            - run: bun run test
            # bun pm pack resolves catalog: and workspace: versions; npm publishes the tarball.
            - name: Publish unpublished package versions
              run: |
                  mkdir -p "$RUNNER_TEMP/packs"
                  for directory in plugins/claude plugins/opencode plugins/oxlint; do
                    NAME=$(node --print "require('./$directory/package.json').name")
                    VERSION=$(node --print "require('./$directory/package.json').version")
                    STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                      "https://registry.npmjs.org/${NAME/\//%2F}/$VERSION")
                    case "$STATUS" in
                      200) echo "$NAME@$VERSION is already published" ;;
                      404)
                        (cd "$directory" && bun pm pack --destination "$RUNNER_TEMP/packs")
                        npm publish "$RUNNER_TEMP/packs/$(echo "${NAME#@}" | tr / -)-$VERSION.tgz" \
                          --provenance --access public
                        ;;
                      *) echo "Registry lookup for $NAME failed with HTTP $STATUS" >&2; exit 1 ;;
                    esac
                  done
            # JSR authenticates with the same OIDC token and skips versions it already has.
            - name: Publish @enfect/oxlint to JSR
              working-directory: plugins/oxlint
              run: npx --yes jsr publish
